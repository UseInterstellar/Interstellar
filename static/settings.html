<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
    <title>Settings - Interstellar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/modern.css" />
    <link rel="stylesheet" href="/assets/css/settings.css" />
</head>
<body class="dark-mode">
    <div class="animated-bg"></div>
    <div class="stars"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-rocket"></i>
                <span>Interstellar</span>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/a">Games</a></li>
                <li><a href="/b">Apps</a></li>
                <li><a href="/c" class="active">Settings</a></li>
            </ul>
            <button class="theme-toggle" onclick="toggleTheme()">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="settings-header">
            <h1><i class="fas fa-cog"></i> Settings</h1>
            <p>Customize your Interstellar experience</p>
        </div>

        <div class="settings-grid">
            <!-- Theme Settings -->
            <div class="settings-card">
                <div class="settings-card-header">
                    <i class="fas fa-palette"></i>
                    <h2>Appearance</h2>
                </div>
                <div class="settings-content">
                    <div class="setting-item">
                        <label>Theme Mode</label>
                        <div class="theme-options">
                            <button class="theme-btn active" onclick="setTheme('dark')" data-theme="dark">
                                <i class="fas fa-moon"></i> Dark
                            </button>
                            <button class="theme-btn" onclick="setTheme('light')" data-theme="light">
                                <i class="fas fa-sun"></i> Light
                            </button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Primary Color</label>
                        <div class="color-picker">
                            <input type="color" id="primaryColor" value="#00d9ff" onchange="changePrimaryColor(this.value)">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Browser Settings -->
            <div class="settings-card">
                <div class="settings-card-header">
                    <i class="fas fa-globe"></i>
                    <h2>Browser</h2>
                </div>
                <div class="settings-content">
                    <div class="setting-item">
                        <label>Tab Cloaking</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="tabCloaking" onchange="saveSetting('tabCloaking', this.checked)">
                            <label for="tabCloaking" class="toggle-label"></label>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>About:Blank Cloaking</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="blankCloaking" onchange="saveSetting('blankCloaking', this.checked)" checked>
                            <label for="blankCloaking" class="toggle-label"></label>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Auto-Refresh History</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="autoRefresh" onchange="saveSetting('autoRefresh', this.checked)" checked>
                            <label for="autoRefresh" class="toggle-label"></label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Privacy Settings -->
            <div class="settings-card">
                <div class="settings-card-header">
                    <i class="fas fa-lock"></i>
                    <h2>Privacy</h2>
                </div>
                <div class="settings-content">
                    <div class="setting-item">
                        <label>Clear History on Exit</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="clearOnExit" onchange="saveSetting('clearOnExit', this.checked)">
                            <label for="clearOnExit" class="toggle-label"></label>
                        </div>
                    </div>
                    <div class="setting-item">
                        <button class="btn-danger" onclick="clearHistory()">
                            <i class="fas fa-trash"></i> Clear All History
                        </button>
                    </div>
                    <div class="setting-item">
                        <button class="btn-danger" onclick="clearCache()">
                            <i class="fas fa-broom"></i> Clear Cache
                        </button>
                    </div>
                </div>
            </div>

            <!-- Advanced Settings -->
            <div class="settings-card">
                <div class="settings-card-header">
                    <i class="fas fa-sliders-h"></i>
                    <h2>Advanced</h2>
                </div>
                <div class="settings-content">
                    <div class="setting-item">
                        <label>User Agent</label>
                        <select id="userAgent" onchange="saveSetting('userAgent', this.value)">
                            <option value="default">Default</option>
                            <option value="chrome">Chrome</option>
                            <option value="firefox">Firefox</option>
                            <option value="safari">Safari</option>
                            <option value="mobile">Mobile</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Request Timeout (seconds)</label>
                        <input type="number" id="timeout" min="5" max="300" value="30" onchange="saveSetting('timeout', this.value)">
                    </div>
                    <div class="setting-item">
                        <label>Max Concurrent Connections</label>
                        <input type="number" id="connections" min="1" max="100" value="10" onchange="saveSetting('connections', this.value)">
                    </div>
                </div>
            </div>

            <!-- About Section -->
            <div class="settings-card">
                <div class="settings-card-header">
                    <i class="fas fa-info-circle"></i>
                    <h2>About</h2>
                </div>
                <div class="settings-content">
                    <div class="about-item">
                        <span>Version:</span>
                        <strong>5.3.0 (Private Secure Fork)</strong>
                    </div>
                    <div class="about-item">
                        <span>Built with:</span>
                        <strong>Node.js + Express</strong>
                    </div>
                    <div class="about-item">
                        <span>License:</span>
                        <strong>AGPL-3.0</strong>
                    </div>
                    <div class="about-item">
                        <span>Security:</span>
                        <strong>✅ Protected</strong>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-footer">
            <button class="btn-primary" onclick="saveAllSettings()">
                <i class="fas fa-save"></i> Save All Settings
            </button>
            <button class="btn-secondary" onclick="resetSettings()">
                <i class="fas fa-undo"></i> Reset to Defaults
            </button>
        </div>
    </div>

    <script src="/assets/js/modern.js"></script>
    <script src="/assets/js/settings.js"></script>
</body>
</html>
